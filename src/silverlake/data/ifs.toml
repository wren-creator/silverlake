# The seed IFS. Paths, owners and permissions are chosen to be plausible, not read off a real system, and the
# ones that matter for a lesson are called out in docs/pase.md. `public` and `owner_mode` use r, w and x with
# dashes for what is missing. `private` gives a profile its own mode. Files carry their text in `content`.
# The mapped /QSYS.LIB is not here, it comes from the library and object store.

[[node]]
path = "/"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/usr"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/usr/bin"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/etc"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/etc/motd"
kind = "file"
owner = "QSYS"
owner_mode = "rw-"
public = "r--"
content = "Welcome to Silverlake. This is a simulated system, for practice.\n"

[[node]]
path = "/QOpenSys/etc/profile"
kind = "file"
owner = "QSYS"
owner_mode = "rw-"
public = "rw-"
content = "# system wide profile, read by every PASE shell at start\nPATH=/QOpenSys/usr/bin:/usr/bin\nexport PATH\n"

[[node]]
path = "/home"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/home/QSECOFR"
owner = "QSECOFR"
public = "---"

[[node]]
path = "/home/STUDENT"
owner = "STUDENT"
public = "---"

[[node]]
path = "/home/STUDENT/notes.txt"
kind = "file"
owner = "STUDENT"
owner_mode = "rw-"
public = "---"
content = "Things to try: ls, cat, cd, id.\n"

[[node]]
path = "/home/OPERATOR"
owner = "OPERATOR"
public = "---"

[[node]]
path = "/home/OPERATOR/.profile"
kind = "file"
owner = "OPERATOR"
owner_mode = "rw-"
public = "r--"
content = "# operator login settings\nexport EDITOR=vi\nPATH=/tmp/opsbin:$PATH\nexport PATH\nid\n"

[[node]]
path = "/home/DEVELOPER"
owner = "DEVELOPER"
public = "r-x"

[[node]]
path = "/home/DEVELOPER/build.sh"
kind = "file"
owner = "DEVELOPER"
owner_mode = "rwx"
public = "r-x"
content = "#!/QOpenSys/usr/bin/bsh\necho building\n"

[[node]]
path = "/home/CLERK"
owner = "CLERK"
public = "---"

[[node]]
path = "/tmp"
owner = "QSYS"
public = "rwx"

[[node]]
path = "/tmp/opsbin"
owner = "OPERATOR"
public = "rwx"

[[node]]
path = "/QOpenSys/etc/ssh"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/etc/ssh/sshd_config"
kind = "file"
owner = "QSYS"
owner_mode = "rw-"
public = "r--"
content = "# the ssh daemon's settings. The files in sshd_config.d are read too, first value wins.\nPasswordAuthentication yes\nPubkeyAuthentication yes\n"

[[node]]
path = "/QOpenSys/etc/ssh/sshd_config.d"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/etc/ssh/sshd_config.d/10-modes.conf"
kind = "file"
owner = "QSYS"
owner_mode = "rw-"
public = "r--"
content = "# StrictModes yes refuses a key file that others can write\nStrictModes no\n"

[[node]]
path = "/QOpenSys/etc/ssh/sshd_config.d/20-access.conf"
kind = "file"
owner = "QSYS"
owner_mode = "rw-"
public = "r--"
content = "# no DenyUsers or AllowUsers: every enabled profile may log in over ssh\n"

[[node]]
path = "/home/DEVELOPER/.ssh"
owner = "DEVELOPER"
public = "r-x"

[[node]]
path = "/home/DEVELOPER/.ssh/authorized_keys"
kind = "file"
owner = "DEVELOPER"
owner_mode = "rw-"
public = "rw-"
content = "# keys allowed to log in as DEVELOPER\n"

[[node]]
path = "/home/DEVELOPER/secret.txt"
kind = "file"
owner = "DEVELOPER"
owner_mode = "rw-"
public = "---"
content = "Deploy token @@FLAG:ssh-strictmodes@@\n"

# The operations area: a few files and a directory the operator set up, some of which anyone can write. Lesson
# pase-find-writable is about finding which, and the secure state takes the write bit off the ones listed there.
[[node]]
path = "/QOpenSys/var"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/var/ops"
owner = "OPERATOR"
public = "r-x"

[[node]]
path = "/QOpenSys/var/ops/README"
kind = "file"
owner = "OPERATOR"
owner_mode = "rw-"
public = "r--"
content = "Operations area. Nightly job settings and the scripts it runs. Ask the operator before changing anything.\n"

[[node]]
path = "/QOpenSys/var/ops/backup.sh"
kind = "file"
owner = "OPERATOR"
owner_mode = "rwx"
public = "rwx"
content = "#!/QOpenSys/usr/bin/bsh\n# nightly backup of the payroll library\necho saving APPLIB\n"

[[node]]
path = "/QOpenSys/var/ops/jobs.conf"
kind = "file"
owner = "OPERATOR"
owner_mode = "rw-"
public = "rw-"
content = "# job schedule\nbackup   02:00   /QOpenSys/var/ops/backup.sh\nreport   06:30   /QOpenSys/var/ops/report.sh\n"

[[node]]
path = "/QOpenSys/var/ops/spool"
owner = "OPERATOR"
public = "rwx"

[[node]]
path = "/QOpenSys/var/ops/notes.txt"
kind = "file"
owner = "OPERATOR"
owner_mode = "rw-"
public = "r--"
content = "backup.sh and jobs.conf were opened up so the night shift could edit them. Close them again.\n"

# Lesson pase-secrets-in-profile: a script the operators read and run, with the transfer password typed into it. The secure
# state swaps the line for one that asks for the password at run time.
[[node]]
path = "/QOpenSys/var/ops/ftp-push.sh"
kind = "file"
owner = "OPERATOR"
owner_mode = "rwx"
public = "r-x"
content = "#!/QOpenSys/usr/bin/bsh\n# push the nightly extract to the bank gateway\nHOST=bank-gw.example.com\nFTP_USER=payxfer\nFTP_PASS=@@FLAG:pase-secrets-in-profile@@\necho sending extract to $HOST as $FTP_USER\n"

# Lesson pase-key-hygiene: the key the deploy job logs in with, left where the operators keep their files. The key pair is made
# from the instance secret (flags.py), the public half is what OPERATOR's authorized_keys lists, and the secure state takes
# the read bit off the private half. OPERATOR's home, .ssh and authorized_keys are closed, so StrictModes is satisfied.
[[node]]
path = "/QOpenSys/var/ops/keys"
owner = "OPERATOR"
public = "r-x"

[[node]]
path = "/QOpenSys/var/ops/keys/deploy_ed25519"
kind = "file"
owner = "OPERATOR"
owner_mode = "rw-"
public = "r--"
content = "@@KEY:private:pase-key-hygiene@@\n"

[[node]]
path = "/QOpenSys/var/ops/keys/deploy_ed25519.pub"
kind = "file"
owner = "OPERATOR"
owner_mode = "rw-"
public = "r--"
content = "@@KEY:public:pase-key-hygiene@@\n"

[[node]]
path = "/home/OPERATOR/.ssh"
owner = "OPERATOR"
public = "---"

[[node]]
path = "/home/OPERATOR/.ssh/authorized_keys"
kind = "file"
owner = "OPERATOR"
owner_mode = "rw-"
public = "---"
content = "@@KEY:public:pase-key-hygiene@@\n"

[[node]]
path = "/home/OPERATOR/deploy-token.txt"
kind = "file"
owner = "OPERATOR"
owner_mode = "rw-"
public = "---"
content = "Deploy token @@FLAG:pase-key-hygiene@@\n"

# Lesson console-cert-audit: where an IBM i keeps the web server's certificate and key. The key file here is a stand in, the
# real key never goes in the seed; what the lesson teaches is that the public may read it.
[[node]]
path = "/QOpenSys/QIBM"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/QIBM/UserData"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/QIBM/UserData/ICSS"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/QIBM/UserData/ICSS/Cert"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/QIBM/UserData/ICSS/Cert/Server"
owner = "QSYS"
public = "r-x"

[[node]]
path = "/QOpenSys/QIBM/UserData/ICSS/Cert/Server/DEFAULT.KEY"
kind = "file"
owner = "QSECOFR"
owner_mode = "rw-"
public = "r--"
content = "# copy of the console key, kept for the nightly backup job\n-----BEGIN PRIVATE KEY-----\nU2lsdmVybGFrZSB0cmFpbmluZyBwbGFjZWhvbGRlcg==\n-----END PRIVATE KEY-----\n"
