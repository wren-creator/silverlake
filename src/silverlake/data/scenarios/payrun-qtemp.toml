id = "payrun-qtemp"
title = "Your own program ahead of the one a privileged program calls"
group = "C"
summary = "PAYRUN adopts its owner and calls PAYCALC by name alone, so a PAYCALC in QTEMP runs first."

[[change]]
target = "object:APPLIB/PAYRUN/*PGM"
field = "data.source"
vulnerable = "file:payrun.rpgle"
secure = "file:payrunx.rpgle"

[cleanup]
restore = ["object:APPLIB/PAYROLL/*FILE"]

[flag]
kind = "state"
check = "student_reads_payroll"
task = "As STUDENT, end up able to read APPLIB/PAYROLL without anyone granting it to you."

[doc]
where = "Program APPLIB/PAYRUN and the library list"
parallel = "A privileged program that calls another by name alone lets the library list decide which one runs. A library you can write to, ahead of the real one, wins."
vulnerability = "PAYRUN adopts its owner and calls PAYCALC with no library. QTEMP is every job's own library and sits ahead of a library added with ADDLIBLE *LAST, so a PAYCALC made there runs first with PAYRUN's authority."
mitre = ["T1574.008 Hijack Execution Flow: Path Interception by Search Order Hijacking", "T1548 Abuse Elevation Control Mechanism"]
steps = [
  "Sign on as STUDENT. ADDLIBLE APPLIB *LAST.",
  "CRTSRCPF FILE(QTEMP/QRPGLESRC), then write a member PAYCALC (type RPGLE) whose code calls QCMDEXC with GRTOBJAUT APPLIB/PAYROLL *FILE STUDENT *USE.",
  "CRTBNDRPG PGM(QTEMP/PAYCALC) SRCFILE(QTEMP/QRPGLESRC), then CALL PGM(APPLIB/PAYRUN).",
]
consequence = "STUDENT ends up with authority on PAYROLL that nobody granted. The program is gone at sign-off."
fix = "Call the program with its library (PAYRUNX calls APPLIB/PAYCALC), keep QTEMP and writable libraries off the front of the list for privileged work, and review the library list of anything that adopts."
reference = "IBM i Security Reference, library list and adopted authority."
