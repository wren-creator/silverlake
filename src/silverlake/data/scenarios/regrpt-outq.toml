id = "regrpt-outq"
title = "A sensitive report printed to the default queue"
group = "B"
summary = "The payroll register prints to QPRINT, where anyone can open it."

[[change]]
target = "object:APPLIB/REGRPT/*FILE"
field = "data.outq"
vulnerable = "QGPL/QPRINT"
secure = "APPLIB/PAYOUTQ"

[cleanup]
remove_new_spool = true

[flag]
kind = "text"
task = "Run the payroll register as payroll staff, then as an ordinary user find the report ID printed in its heading."
