id = "pase-secrets-in-profile"
title = "The password typed into the script"
group = "E"
summary = "An operations script everyone can read has the bank gateway password written in it, and a few filters find it without opening a single file."

[[change]]
target = "ifs:/QOpenSys/var/ops/ftp-push.sh"
field = "content"
vulnerable = "#!/QOpenSys/usr/bin/bsh\n# push the nightly extract to the bank gateway\nHOST=bank-gw.example.com\nFTP_USER=payxfer\nFTP_PASS=@@FLAG:pase-secrets-in-profile@@\necho sending extract to $HOST as $FTP_USER\n"
secure = "#!/QOpenSys/usr/bin/bsh\n# push the nightly extract to the bank gateway\nHOST=bank-gw.example.com\nFTP_USER=payxfer\n# the password is read from the operator's protected key store at run time, never kept here\necho sending extract to $HOST as $FTP_USER\n"

[cleanup]
remove_new_ifs = true

[flag]
kind = "text"
task = "As STUDENT, find the password written in a script under /QOpenSys/var and read it out without opening the files one at a time."

[doc]
where = "PASE terminal, CALL PGM(QP2TERM) or ssh to 127.0.0.1:2222"
parallel = "People type a password into a script to make a job run unattended and never take it out. Anyone who can read the script reads the password. The search an attacker runs is the filters: find the files, grep for a word like pass, cut the value out."
vulnerability = "/QOpenSys/var/ops/ftp-push.sh is readable by every profile and sets FTP_PASS to the real password for the bank gateway."
mitre = ["T1552.001 Unsecured Credentials: Credentials In Files", "T1083 File and Directory Discovery"]
steps = [
  "Sign on as STUDENT and CALL PGM(QP2TERM) (or ssh in).",
  "find /QOpenSys/var -type f lists the files without opening them.",
  "find /QOpenSys/var -type f | xargs grep -i pass shows every line that mentions a password.",
  "Cut the value out: find /QOpenSys/var -type f | xargs grep -i pass | cut -d= -f2, or sed 's/.*=//'.",
]
consequence = "Anyone with a login can use the credentials a job runs with, and the bank gateway cannot tell them apart from the operator."
fix = "Keep passwords out of scripts: read them from a protected store at run time (the secure state does), take read away from everyone but the owner where a secret must live in a file, and rotate a password that was exposed."
reference = "CWE-798 Use of Hard-coded Credentials; CWE-312 Cleartext Storage of Sensitive Information; MITRE ATT&CK T1552.001."
