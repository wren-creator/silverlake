id = "default-passwords"
title = "Every password is the profile name"
group = "A"
summary = "Passwords equal the profile name, so one guess opens every account."

[[change]]
target = "system"
field = "qpwdminlen"
vulnerable = 1
secure = 8

[[change]]
target = "system"
field = "qpwdrqddgt"
vulnerable = 0
secure = 1

[[change]]
target = "profile:QSECOFR"
field = "password"
vulnerable = "QSECOFR"
secure = "secret:QSECOFR"

[[change]]
target = "profile:SECADMIN"
field = "password"
vulnerable = "SECADMIN"
secure = "secret:SECADMIN"

[[change]]
target = "profile:OPERATOR"
field = "password"
vulnerable = "OPERATOR"
secure = "secret:OPERATOR"

[[change]]
target = "profile:DEVELOPER"
field = "password"
vulnerable = "DEVELOPER"
secure = "secret:DEVELOPER"

[flag]
kind = "text"
task = "Sign on as the security officer and find the change ticket in its printed job log."
