id = "default-passwords"
title = "Every password is the profile name"
group = "A"
summary = "Passwords equal the profile name, so one guess opens every account."

[[change]]
target = "system"
field = "qpwdminlen"
vulnerable = 1
secure = 8

[[change]]
target = "system"
field = "qpwdrqddgt"
vulnerable = 0
secure = 1

[[change]]
target = "profile:QSECOFR"
field = "password"
vulnerable = "QSECOFR"
secure = "secret:QSECOFR"

[[change]]
target = "profile:SECADMIN"
field = "password"
vulnerable = "SECADMIN"
secure = "secret:SECADMIN"

[[change]]
target = "profile:OPERATOR"
field = "password"
vulnerable = "OPERATOR"
secure = "secret:OPERATOR"

[[change]]
target = "profile:DEVELOPER"
field = "password"
vulnerable = "DEVELOPER"
secure = "secret:DEVELOPER"

[flag]
kind = "text"
task = "Sign on as the security officer and find the change ticket in its printed job log."

[doc]
where = "5250 sign-on screen, any profile"
parallel = "Default and guessable passwords are among the most common findings in any platform's security review, IBM i included, where a profile name used as its own password is the textbook case."
vulnerability = "Every seeded profile has its own name as its password and the password rules are off (minimum length 1, no digit required), so the first guess works for QSECOFR, SECADMIN, OPERATOR and DEVELOPER."
mitre = ["T1078 Valid Accounts", "T1110.001 Brute Force: Password Guessing"]
steps = [
  "Sign on as OPERATOR with the password OPERATOR. It works.",
  "Sign off and sign on as QSECOFR with the password QSECOFR.",
  "Find the security officer's job log among its spooled files and display it.",
]
consequence = "Full control of the system, and the change ticket reference in the job log."
fix = "Rotate the passwords of the profiles that matter, set QPWDMINLEN to 8 and QPWDRQDDGT to 1, and keep QMAXSIGN low so guessing is not free."
reference = "IBM i Security Reference, password rules (QPWDMINLEN, QPWDRQDDGT, QPWDLMTAJC); CIS controls on account management."
