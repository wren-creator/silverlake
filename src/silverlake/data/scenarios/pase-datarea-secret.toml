id = "pase-datarea-secret"
title = "The transfer key in the data area"
group = "E"
summary = "A data area holds the payroll transfer settings, key included, and anyone who can reach it can read it from a shell."

[[change]]
target = "object:APPLIB/PAYXFER/*DTAARA"
field = "public"
vulnerable = "*USE"
secure = "*EXCLUDE"

[flag]
kind = "text"
task = "As STUDENT, find the data area in APPLIB that holds the payroll transfer settings and read the transfer key out of it."

[doc]
where = "PASE terminal, CALL PGM(QP2TERM) or ssh to 127.0.0.1:2222"
parallel = "Data areas are the old place to keep a setting a program reads at run time, and people keep putting passwords and keys in them because nothing about one looks like a secret. The authority is on the object, so anyone who can reach the library and has *USE can read it, from a 5250 session with RTVDTAARA or from a shell with datarea."
vulnerability = "APPLIB/PAYXFER is a data area with *PUBLIC *USE. Its text says what it is for, and its value holds the host, the user and the key of the payroll transfer."
mitre = ["T1552.001 Unsecured Credentials: Credentials In Files", "T1083 File and Directory Discovery", "T1005 Data from Local System"]
steps = [
  "Sign on as STUDENT and CALL PGM(QP2TERM) (or ssh in).",
  "ls /QSYS.LIB/APPLIB.LIB lists the objects. PAYXFER.DTAARA is one of them.",
  "datarea only runs in QSH, so qsh -c 'datarea -r /QSYS.LIB/APPLIB.LIB/PAYXFER.DTAARA' prints the value. Running datarea straight from the shell says cannot execute.",
  "The key is in the value.",
]
consequence = "Anyone with a login can read the credentials the payroll transfer uses to reach the bank gateway."
fix = "Keep secrets out of data areas, or take public authority off the area (the secure state does: *EXCLUDE) and give it to the one profile that runs the transfer. Rotate a key that was exposed."
reference = "CWE-312 Cleartext Storage of Sensitive Information; IBM i Security Reference, object authority; MITRE ATT&CK T1552."
