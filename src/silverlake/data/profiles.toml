# Silverlake seed: the range's golden state for users and access.
#
# To assign access, edit a profile here (or copy this file and point
# SILVERLAKE_PROFILES at the copy), then run ./reset.sh. docs/access-model.md
# explains every field. This file is deliberately weak: passwords equal the
# profile name, and a few accounts are over-privileged on purpose.

[system]
qsecurity = 40        # 20, 30, 40 or 50. Try 20: every *USER gets *ALLOBJ.
qpwdlvl   = 0         # 0 or 1 ignore case in passwords, 2 and 3 do not
mode      = "vulnerable"
default_profile_owner = "SECADMIN"   # the security administrator created the accounts below

# ---------------------------------------------------------------------------
# One account per user class. special_authorities is left out, so each gets
# what its class gives at the QSECURITY level above (SPCAUT(*USRCLS)).
# ---------------------------------------------------------------------------

[[profile]]
name = "QSECOFR"
user_class = "*SECOFR"
password = "QSECOFR"
text = "Security officer. Every special authority."

[[profile]]
name = "QSYS"
user_class = "*SECOFR"
password = "*NONE"
owner = "QSYS"
text = "IBM-supplied system profile. Owns the system libraries. Cannot sign on."

[[profile]]
name = "QDFTOWN"
password = "*NONE"
owner = "QSECOFR"
text = "IBM-supplied default owner. Cannot sign on."

[[profile]]
name = "SECADMIN"
user_class = "*SECADM"
owner = "QSECOFR"
password = "SECADMIN"
text = "Security administrator. Manages profiles."

[[profile]]
name = "DEVELOPER"
user_class = "*PGMR"
password = "DEVELOPER"
group_profile = "GRPDEV"
text = "Programmer."

[[profile]]
name = "OPERATOR"
user_class = "*SYSOPR"
password = "OPERATOR"
text = "System operator."

[[profile]]
name = "STUDENT"
user_class = "*USER"
password = "STUDENT"
text = "Ordinary user. The account most attacks start from."

# ---------------------------------------------------------------------------
# Tighter than the class: SPCAUT(*NONE) and limited capabilities.
# ---------------------------------------------------------------------------

[[profile]]
name = "GUEST"
user_class = "*USER"
special_authorities = "*NONE"
limited_capabilities = "*YES"
password = "GUEST"
text = "No special authority, limited capabilities."

# ---------------------------------------------------------------------------
# One special authority each, on an ordinary *USER. Hand out exactly one thing
# and see what it is worth.
# ---------------------------------------------------------------------------

[[profile]]
name = "AUDITOR"
special_authorities = ["*AUDIT"]
password = "AUDITOR"
text = "*AUDIT only."

[[profile]]
name = "IOADMIN"
special_authorities = ["*IOSYSCFG"]
password = "IOADMIN"
text = "*IOSYSCFG only."

[[profile]]
name = "JOBMAN"
special_authorities = ["*JOBCTL"]
password = "JOBMAN"
text = "*JOBCTL only."

[[profile]]
name = "BACKUP"
special_authorities = ["*SAVSYS"]
password = "BACKUP"
text = "*SAVSYS only. Can save and restore any object."

[[profile]]
name = "SECONLY"
special_authorities = ["*SECADM"]
password = "SECONLY"
text = "*SECADM only. Cannot give away what it does not hold."

[[profile]]
name = "SVCTOOLS"
special_authorities = ["*SERVICE"]
password = "SVCTOOLS"
text = "*SERVICE only."

[[profile]]
name = "SPOOLMAN"
special_authorities = ["*SPLCTL"]
password = "SPOOLMAN"
text = "*SPLCTL only."

# ---------------------------------------------------------------------------
# The mistakes real systems actually have.
# ---------------------------------------------------------------------------

[[profile]]
name = "SVCACCT"
special_authorities = ["*ALLOBJ"]
password = "SVCACCT"
text = "Service account with *ALLOBJ it does not need."

[[profile]]
name = "LEGACY"
user_class = "*PGMR"
special_authorities = ["*ALLOBJ", "*JOBCTL"]
password = "LEGACY"
text = "Programmer with *ALLOBJ, left over from a long gone project."

[[profile]]
name = "DEVADMIN"
user_class = "*PGMR"
special_authorities = ["*SECADM"]
password = "DEVADMIN"
text = "Programmer who was given *SECADM for a day, years ago."

[[profile]]
name = "NOPWD"
password = "*NONE"
text = "PASSWORD(*NONE). Cannot sign on, can still own things and run jobs."

# A clerk locked to one menu: limited capabilities *YES, so no command line. Nothing
# stops the menu itself from offering a way out (see APPLIB/RESTRICT, option 9).
[[profile]]
name = "CLERK"
user_class = "*USER"
password = "CLERK"
limited_capabilities = "*YES"
initial_menu = "RESTRICT"
current_library = "APPLIB"
text = "Limited capabilities. Lives in one menu. The menu has a hole."

[[profile]]
name = "OLDTEMP"
status = "*DISABLED"
password = "OLDTEMP"
text = "Disabled contractor account."

[[profile]]
name = "GRPDEV"
password = "*NONE"
text = "Group profile for the developers."

# ---------------------------------------------------------------------------
# Libraries and objects, so object authority has something to be checked
# against. A library is an object of type *LIB in QSYS. Reaching anything in a
# library takes *EXECUTE on the library first, so a wide open object in a locked
# library is still out of reach (SRCLIB/QRPGSRC below is exactly that mistake).
# ---------------------------------------------------------------------------

[[authorization_list]]
name = "PAYAUTL"
public = "*EXCLUDE"
[authorization_list.entries]
SECADMIN = "*ALL"
OPERATOR = "*USE"

# Public authorities on QSYS (*USE) and QGPL (*CHANGE) and their owner (QSYS) were
# read off a real IBM i with DSPOBJAUT. The others are guesses.
[[object]]
name = "QSYS"
owner = "QSYS"
public = "*USE"
text = "System library"

[[object]]
name = "QSYS2"
owner = "QSYS"
public = "*USE"
text = "System library for CPI's"

[[object]]
name = "QHLPSYS"
owner = "QSYS"
public = "*USE"
text = "System help library"

[[object]]
name = "QGPL"
owner = "QSYS"
public = "*CHANGE"
text = "General purpose library"

[[object]]
name = "QUSRSYS"
owner = "QSYS"
public = "*CHANGE"
text = "System library for users"

[[object]]
name = "QTEMP"
owner = "QSYS"
public = "*CHANGE"
text = "Temporary library, one per job on a real system"

[[object]]
name = "APPLIB"
owner = "QSECOFR"
public = "*USE"
text = "Application library"

[[object]]
library = "APPLIB"
name = "PAYROLL"
type = "*FILE"
owner = "QSECOFR"
public = "*AUTL"
autl = "PAYAUTL"
text = "Payroll master. Secured by an authorization list."

[[object]]
library = "APPLIB"
name = "CUSTOMERS"
type = "*FILE"
owner = "QSECOFR"
public = "*USE"
text = "Customer master."
[object.private]
DEVELOPER = "*CHANGE"
GUEST = "*EXCLUDE"

[[object]]
name = "SRCLIB"
owner = "DEVELOPER"
public = "*EXCLUDE"
text = "Developer source library. Locked to the group."
[object.private]
GRPDEV = "*CHANGE"

[[object]]
library = "SRCLIB"
name = "QRPGSRC"
type = "*FILE"
owner = "DEVELOPER"
public = "*CHANGE"
text = "RPG source. Wide open, but the library is locked."

[[object]]
name = "SCRATCH"
owner = "STUDENT"
public = "*CHANGE"
text = "Student scratch library."

# ---------------------------------------------------------------------------
# Menus and the one program menus can reach. Layout follows a real MAIN menu;
# the wording is ours. Option commands run with the user's own authority.
# ---------------------------------------------------------------------------

[[object]]
name = "QCMD"
type = "*PGM"
owner = "QSYS"
public = "*USE"
text = "Command entry. Anyone who can call it can run commands."

[[object]]
name = "MAIN"
type = "*MENU"
owner = "QSYS"
public = "*USE"
text = "Main menu"
[object.data]
title = "Silverlake Main Menu"
[[object.data.items]]
opt = "1"
text = "Display the library list"
cmd = "DSPLIBL"
[[object.data.items]]
opt = "2"
text = "Work with libraries"
cmd = "WRKLIB LIB(*ALL)"
[[object.data.items]]
opt = "3"
text = "Work with user profiles"
cmd = "WRKUSRPRF"
[[object.data.items]]
opt = "4"
text = "Application menu"
cmd = "GO MENU(APPLIB/APPMENU)"
[[object.data.items]]
opt = "5"
text = "Command entry"
cmd = "CALL QCMD"
[[object.data.items]]
opt = "90"
text = "Sign off"
cmd = "SIGNOFF"

[[object]]
library = "APPLIB"
name = "APPMENU"
type = "*MENU"
owner = "QSECOFR"
public = "*USE"
text = "Application menu"
[object.data]
title = "Application Menu"
[[object.data.items]]
opt = "1"
text = "Who can use the customer file"
cmd = "DSPOBJAUT OBJ(APPLIB/CUSTOMERS) OBJTYPE(*FILE)"
[[object.data.items]]
opt = "2"
text = "Who can use the payroll file"
cmd = "DSPOBJAUT OBJ(APPLIB/PAYROLL) OBJTYPE(*FILE)"
[[object.data.items]]
opt = "90"
text = "Sign off"
cmd = "SIGNOFF"

[[object]]
library = "APPLIB"
name = "RESTRICT"
type = "*MENU"
owner = "QSECOFR"
public = "*USE"
text = "Clerk menu. Option 9 is the mistake."
[object.data]
title = "Clerk Menu"
[[object.data.items]]
opt = "1"
text = "Who can use the customer file"
cmd = "DSPOBJAUT OBJ(APPLIB/CUSTOMERS) OBJTYPE(*FILE)"
[[object.data.items]]
opt = "2"
text = "Display the library list"
cmd = "DSPLIBL"
[[object.data.items]]
opt = "9"
text = "Maintenance"
cmd = "CALL QCMD"
[[object.data.items]]
opt = "90"
text = "Sign off"
cmd = "SIGNOFF"

# ---------------------------------------------------------------------------
# Output queues and spool files. A queue's DSPDTA setting decides who may read
# other people's files on it (see docs/jobs-spool-messages.md). QPRINT is the
# classic mistake: DSPDTA(*YES) and public *USE, so anyone can read a report
# somebody printed. QEZJOBLOG holds job logs and is the safer shape.
# ---------------------------------------------------------------------------

[[object]]
library = "QUSRSYS"
name = "QEZJOBLOG"
type = "*OUTQ"
owner = "QSYS"
public = "*USE"
text = "Job logs"
[object.data]
dspdta = "*OWNER"
oprctl = "*YES"
autchk = "*OWNER"

[[object]]
library = "QGPL"
name = "QPRINT"
type = "*OUTQ"
owner = "QSYS"
public = "*USE"
text = "Default printer output"
[object.data]
dspdta = "*YES"
oprctl = "*YES"
autchk = "*OWNER"

[[spool_file]]
name = "PAYRPT"
user = "DEVELOPER"
