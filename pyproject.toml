[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silverlake"
version = "0.0.1"
description = "A clean-room IBM i (AS/400) security range"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
silverlake = "silverlake.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
