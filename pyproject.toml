[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "silverlake"
version = "0.0.1"
description = "A clean-room IBM i (AS/400) security range"
requires-python = ">=3.12"
license = { text = "GPL-3.0-or-later" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
# RPG programs run on rpgle_library, which is not on PyPI yet. setup.sh installs it from the sibling folder
# or from GitHub. Without it Silverlake runs and CALL on an RPG program says the runtime is missing.
rpg = ["rpgle_library @ git+https://github.com/wren-creator/rpgle_library#subdirectory=python"]

[project.scripts]
silverlake = "silverlake.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
silverlake = ["data/*.toml", "data/rpg/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
